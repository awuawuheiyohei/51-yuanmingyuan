<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>圆明园 · 本地 3D 复原</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <canvas id="view"></canvas>

    <div id="loading">
      <div class="spinner"></div>
      <div class="txt">正在构建圆明园 …</div>
    </div>

    <!-- 左：景点 -->
    <div class="panel panel-left">
      <div class="head">
        <h1>圆明园</h1>
        <p class="sub">本地 3D 复原 · 乾隆盛世全貌</p>
      </div>
      <div class="panel-toggle">－</div>
      <div class="body">
        <div class="sec-title">景点</div>
        <div id="scene-list" class="scene-list"></div>
      </div>
    </div>

    <!-- 右：镜头与控制 -->
    <div class="panel panel-right">
      <div class="panel-toggle">－</div>
      <div class="body">
        <div class="sec-title">镜头</div>
        <div id="shot-list" class="shot-list"></div>

        <div class="sec-title">控制</div>
        <div class="btn-row">
          <button id="btn-mode" class="btn">一镜到底巡游</button>
          <button id="btn-play" class="btn">暂停</button>
          <button id="btn-shot" class="btn">截图</button>
        </div>

        <div class="sec-title">透视</div>
        <div class="slider-row">
          <input id="focal-slider" type="range" min="14" max="120" step="1" value="35" />
          <span id="focal-label" class="time-label">35mm</span>
        </div>
        <div class="btn-row">
          <button id="btn-shift" class="btn active">两点透视</button>
        </div>

        <div class="sec-title">时段</div>
        <div class="slider-row">
          <input id="time-slider" type="range" min="4" max="20" step="0.1" value="9.5" />
          <span id="time-label" class="time-label">09:30</span>
        </div>

        <p class="hint">
          拖拽旋转 · 滚轮缩放 · 右键平移<br />
          空格 切换巡游 / 自由 · P 截图
        </p>
      </div>
    </div>

    <!-- 底部：镜头字幕 -->
    <div id="shot-progress">
      <div id="shot-title" class="shot-title"></div>
      <div class="progress-track"><div id="progress-bar"></div></div>
    </div>

    <!-- 景点说明 -->
    <div id="info" class="info"></div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
